      "Package": "CSIndicators",
      "Version": "1.2.0",
      "Source": "Repository",
      "Title": "Climate Services' Indicators Based on Sub-Seasonal to Decadal Predictions",
      "Authors@R": "c( person(\"Nuria\", \"Perez-Zanon\", , \"nuria.perez@bsc.es\", role = c(\"aut\"), comment = c(ORCID = \"0000-0001-8568-3071\")), person(\"Chou\", \"Chihchung\", ,\"chihchung.chou@bsc.es\", role = \"aut\"), person(\"Llorenç\", \"Lledó\", , \"llorenc.lledo@bsc.es\", role = \"aut\"), person(\"Victòria\", \"Agudetse\", , \"victoria.agudetse@bsc.es\", role = c(\"ctb\", \"cre\")), person(\"Eva\", \"Rifà\", , \"eva.rifarovira@bsc.es\", role = c(\"ctb\")), person(\"González-Reviriego\", \"Nube\", , \"nube.gonzalez@bsc.es\", role = \"ctb\"), person(\"Marcos\", \"Raül\", , \"raul.marcos@bsc.es\", role = \"ctb\"), person(\"Palma\", \"Lluis\", , \"lluis.palma@bsc.es\", role = \"ctb\"), person(\"An-Chi\", \"Ho\", , \"an.ho@bsc.es\", role = c(\"ctb\")), person(\"Javier\", \"Corvillo\", , \"javier.corvillo@bsc.es\", role = c(\"ctb\")), person(\"Alberto\", \"Bojaly\", , , role = c(\"ctb\")), person(\"Theertha\", \"Kariyathan\", ,\"theertha.kariyathan@bsc.es\", role = c(\"ctb\")), person(\"BSC-CNS\", role = \"cph\"))",
      "Description": "Set of generalised tools for the flexible computation of climate  related indicators defined by the user. Each method represents a specific  mathematical approach which is combined with the possibility to select an  arbitrary time period to define the indicator. This enables a wide range of  possibilities to tailor the most suitable indicator for each particular climate  service application (agriculture, food security, energy, water management, health...).  This package is intended for sub-seasonal, seasonal and decadal climate  predictions, but its methods are also applicable to other time-scales,  provided the dimensional structure of the input is maintained. Additionally,  the outputs of the functions in this package are compatible with 'CSTools'.  This package is described in Pérez-Zanón et al. (2023)  <doi:10.1016/j.cliser.2023.100393> and was developed in the context of the  H2020 projects MED-GOLD (776467) and S2S4E (776787) projects, as well as the  Horizon Europe project MEDEWSA (101121192) and the national project BOREAS  (PID2022-140673OA-I00). See Lledó et al. (2019)  <doi:10.1016/j.renene.2019.04.135> and Chou et al., 2023  <doi:10.1016/j.cliser.2023.100345> for details.",
      "Depends": [
        "R (>= 3.6.0)"
      ],
